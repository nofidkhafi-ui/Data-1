<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4M Change Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: toolbar atas + dua panel (daftar record di kiri, editor di kanan). Gaya lembar kerja pabrik: netral dingin, aksen biru, status OK/NG berwarna. */
:root{
  --bg:#eceff2; --panel:#ffffff; --ink:#1b2430; --muted:#5b6776; --line:#d2d9e1; --soft:#f4f6f8;
  --accent:#1d5fa8; --accent-ink:#ffffff; --ok:#1d7a4b; --ok-bg:#e1f3e8; --ng:#b3261e; --ng-bg:#fbe5e3;
  --warn:#8a5a00; --warn-bg:#fdf0d2; --na:#586271; --na-bg:#e6e9ee;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1b222b; --ink:#e6ebf1; --muted:#98a4b3; --line:#2f3947; --soft:#222b36;
  --accent:#6aa7ec; --accent-ink:#0b1622; --ok:#58c58a; --ok-bg:#16301f; --ng:#ff8a80; --ng-bg:#3a1c1a;
  --warn:#f0be5b; --warn-bg:#3a2d10; --na:#a9b3c0; --na-bg:#2a3340; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1b222b; --ink:#e6ebf1; --muted:#98a4b3; --line:#2f3947; --soft:#222b36;
  --accent:#6aa7ec; --accent-ink:#0b1622; --ok:#58c58a; --ok-bg:#16301f; --ng:#ff8a80; --ng-bg:#3a1c1a;
  --warn:#f0be5b; --warn-bg:#3a2d10; --na:#a9b3c0; --na-bg:#2a3340; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0;max-width:1480px;margin:0 auto}
.brand{font-weight:600;font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--panel)}
.tab[aria-current="page"]{background:var(--panel);color:var(--ink);border-color:var(--line)}
#saveState{margin-left:auto;font:12px var(--mono);color:var(--muted)}
#saveState.bad{color:var(--ng)}
main{max-width:1480px;margin:0 auto}
.split{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.list{padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto}
.listhead{display:flex;flex-direction:column;gap:8px}
.editor{padding:20px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--ng)}
.btn.sm{padding:4px 8px;font-size:12px}
input[type=text],input[type=date],input[type=search],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:60px}
.li{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 11px;cursor:pointer}
.li:hover{background:var(--soft)}
.li[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.li b{display:block;font-weight:600;overflow-wrap:anywhere}
.li span{font-size:12px;color:var(--muted)}
.mini{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:17px;margin:0 0 6px}
.empty .btn{margin-top:12px}
h2.h{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.2px}
label.f.wide{grid-column:1/-1}
.bar{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.bar .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--ok);transition:width .2s}
.bar b{font:500 13px var(--mono)}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:auto minmax(120px,1fr) minmax(140px,1.2fr) auto;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.ci:last-child{border-bottom:1px solid var(--line)}
.ci input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.ci .nm{font-weight:500;overflow-wrap:anywhere}
.ci.done .nm{color:var(--muted);text-decoration:line-through}
.ci .stamp{font:11px var(--mono);color:var(--muted)}
.ix{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 7px;border-radius:4px}
.ix:hover{background:var(--soft);color:var(--ink)}
.ix.del:hover{color:var(--ng)}
.addline{display:flex;gap:8px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.actions .sp{flex:1}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:500 12px var(--mono);padding:3px 9px;border-radius:99px;background:var(--na-bg);color:var(--na)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.ng{background:var(--ng-bg);color:var(--ng)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.rwrap{overflow-x:auto}
.rhead,.rrow{display:grid;grid-template-columns:34px minmax(110px,1.1fr) 108px 92px minmax(210px,2.3fr) 118px 78px;gap:8px;align-items:start}
.rhead{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:0 0 6px}
.rrow{padding:10px 0;border-top:1px solid var(--line)}
.rrow .no{font:500 13px var(--mono);color:var(--muted);padding-top:8px}
.rrow .acts{display:flex;gap:0;justify-content:flex-end;padding-top:2px}
.rrow select[data-v="OK"]{background:var(--ok-bg);color:var(--ok);font-weight:600}
.rrow select[data-v="NG"]{background:var(--ng-bg);color:var(--ng);font-weight:600}
.rrow select[data-v="Deviasi"]{background:var(--warn-bg);color:var(--warn);font-weight:600}
.rrow select[data-v="N/A"]{background:var(--na-bg);color:var(--na);font-weight:600}
.ev{display:flex;flex-direction:column;gap:6px;min-width:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;background:var(--soft);width:64px;height:64px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.addph{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:1px dashed var(--muted);border-radius:5px;cursor:pointer;color:var(--muted);font-size:12px;text-align:center;line-height:1.2}
.addph:hover{border-color:var(--accent);color:var(--accent)}
.thumbs .ph{width:64px;height:64px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.rl{display:none}
.le{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.le li{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.le .idx{font:12px var(--mono);color:var(--muted);text-align:right}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;background:var(--panel)}
.card h3{margin:0 0 4px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.note{font-size:12px;color:var(--muted)}
#modalBg,#lb{position:fixed;inset:0;background:rgba(10,15,22,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modalBg[hidden],#lb[hidden]{display:none}
.modal{background:var(--panel);border-radius:10px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h3{margin:0 0 12px}
.modal .fields{grid-template-columns:1fr}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#lb{flex-direction:column;gap:12px}
#lb img{max-width:100%;max-height:78vh;border-radius:6px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;max-width:90vw}
#toast[hidden]{display:none}

/* lembar cetak */
#sheetWrap{display:none}
.sh{font:10pt/1.3 Calibri,Arial,sans-serif;color:#000;background:#fff;width:100%}
.sh table{border-collapse:collapse;width:100%}
.sh td,.sh th{border:1px solid #000;padding:3px 5px;vertical-align:middle}
.sh .hd td{height:17mm}
.sh .lg{width:26%;text-align:center} .sh .lg img{height:15mm}
.sh .tt{text-align:center;font-weight:700;font-size:15pt}
.sh .info{margin:3mm 0;border:0} .sh .info td{border:0;padding:1px 4px} .sh .info td:first-child{width:30mm}
.sh .main th{background:#e7eaee;font-weight:700;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh .c{text-align:center}
.sh .evc{text-align:center;padding:2mm}
.sh .evc img{max-width:48mm;max-height:42mm;margin:1mm;vertical-align:middle}
.sh .evt{font-size:8.5pt;margin-top:1mm;overflow-wrap:anywhere}
.sh .main tr{break-inside:avoid;page-break-inside:avoid}
.sh .res{font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh .res.NG{background:#fbd5d1} .sh .res.Deviasi{background:#fde7b0}
@page{size:A4 portrait;margin:10mm}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#sheetWrap){display:none!important}
  #sheetWrap{display:block}
}
@media (max-width:1180px){
  .rhead{display:none}
  .rrow{grid-template-columns:1fr 1fr;gap:10px}
  .rrow .no{grid-column:1/-1;padding-top:0}
  .rrow .ev{grid-column:1/-1}
  .rrow .acts{grid-column:1/-1;justify-content:flex-start}
  .rl{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
}
@media (max-width:820px){
  .split{grid-template-columns:minmax(0,1fr)}
  .list{position:static;max-height:300px}
  .editor{padding:14px}
  .ci{grid-template-columns:auto minmax(0,1fr) auto}
  .ci .note{grid-column:2/-1}
  #saveState{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">4M Change Control<small>SMT Engineering · checklist persiapan dan report verifikasi</small></div>
  <nav class="tabs" aria-label="Menu utama">
    <button class="tab" data-act="tab" data-t="check">Checklist Persiapan</button>
    <button class="tab" data-act="tab" data-t="report">Report Verifikasi</button>
    <button class="tab" data-act="tab" data-t="settings">Pengaturan</button>
    <button class="tab" data-act="tab" data-t="backup">Backup</button>
  </nav>
  <span id="saveState" role="status">memuat…</span>
  <button class="btn sm" id="logout" data-act="logout" hidden>Keluar</button>
</header>
<main id="app"></main>
<div id="sheetWrap"></div>
<div id="modalBg" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="lb" hidden><img alt="Evidence"><div><button class="btn danger" data-act="lbDel">Hapus foto</button> <button class="btn" data-act="lbClose">Tutup</button></div></div>
<div id="toast" hidden></div>

function setState(s,txt){const el=$('#saveState');el.textContent=txt;el.classList.toggle('bad',!!s)}

async function saveNow(){
  if(!sb||!user||!db)return;
  if(saving){queue();return}
  saving=true;clearTimeout(saveTimer);
  const cs=[...dirty.c].map(id=>db.checklists.find(x=>x.id===id)).filter(Boolean),rs=[...dirty.r].map(id=>db.reports.find(x=>x.id===id)).filter(Boolean),st=dirty.s;
  dirty.c.clear();dirty.r.clear();dirty.s=false;
  try{
    if(cs.length){const {error}=await sb.from('cc_checklists').upsert(cs.map(c=>({id:c.id,project:c.project||'',doc_date:c.date||null,data:c,created_at:iso(c.created),updated_at:iso(c.updated)})));if(error)throw error}
    if(rs.length){const {error}=await sb.from('cc_reports').upsert(rs.map(r=>({id:r.id,project:r.project||'',doc_date:r.date||null,data:r,created_at:iso(r.created),updated_at:iso(r.updated)})));if(error)throw error}
    if(st){const {error}=await sb.from('cc_settings').upsert({owner:user.id,data:db.settings,updated_at:iso()});if(error)throw error}
    setState(0,'tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    cs.forEach(c=>dirty.c.add(c.id));rs.forEach(r=>dirty.r.add(r.id));if(st)dirty.s=true;
    setState(1,'gagal menyimpan, mencoba lagi… ('+(e&&e.message||e)+')');saveTimer=setTimeout(saveNow,8000);
  }finally{saving=false}
}
async function sbDel(table,id){dirty.c.delete(id);dirty.r.delete(id);const {error}=await sb.from(table).delete().eq('id',id);if(error)toast('Gagal menghapus di server: '+error.message)}
function dataURLtoBlob(u){const [h,b]=u.split(',');const m=h.match(/:(.*?);/)[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
const blobToDataURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(f.error);f.readAsDataURL(b)});
async function addPhoto(r,p){
  const path=`${user.id}/${p.id}.jpg`;
  const {error}=await sb.storage.from(BUCKET).upload(path,dataURLtoBlob(p.data),{contentType:'image/jpeg',upsert:true});
  if(error)throw error;
  p.path=path;photos.set(p.id,p);r.pm=r.pm||{};r.pm[p.id]={path,w:p.w,h:p.h};
}
function delPhoto(r,id){const p=photos.get(id);photos.delete(id);if(r&&r.pm)delete r.pm[id];if(p&&p.path)sb.storage.from(BUCKET).remove([p.path]).catch(()=>{})}
async function loadPhoto(id){
  const p=photos.get(id);if(!p||p.data)return;
  if(!p.job)p.job=(async()=>{const {data,error}=await sb.storage.from(BUCKET).download(p.path);if(error)throw error;p.data=await blobToDataURL(data)})().catch(()=>{p.failed=true}).finally(()=>{p.job=null});
  return p.job;
}
function refreshThumbs(){const r=curR();if(!r)return;document.querySelectorAll('[data-row]').forEach(el=>{const w=r.rows.find(x=>x.id===el.dataset.row);const t=el.querySelector('.thumbs');if(w&&t)t.innerHTML=thumbsHTML(w)})}
function ensurePhotos(r){if(!r)return;const ids=r.rows.flatMap(w=>w.ev).filter(id=>photos.get(id)&&!photos.get(id).data);if(ids.length)Promise.all(ids.map(loadPhoto)).then(refreshThumbs)}
async function ensureAll(r){await Promise.all(r.rows.flatMap(w=>w.ev).map(loadPhoto))}
async function loadAll(){
  const [s,c,r]=await Promise.all([sb.from('cc_settings').select('data').maybeSingle(),sb.from('cc_checklists').select('data'),sb.from('cc_reports').select('data')]);
  for(const x of [s,c,r])if(x.error)throw x.error;
  const def=defaultDB();
  db={v:1,settings:s.data?s.data.data:def.settings,checklists:(c.data||[]).map(x=>x.data),reports:(r.data||[]).map(x=>x.data)};
  db.settings.defaults=db.settings.defaults||def.settings.defaults;
  photos.clear();
  db.reports.forEach(rp=>{rp.pm=rp.pm||{};Object.entries(rp.pm).forEach(([id,m])=>photos.set(id,{id,path:m.path,w:m.w,h:m.h,data:null}))});
  if(!s.data){dirty.s=true;await saveNow()}
}

/* ---------- file helpers ---------- */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const M=1100;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res({data:c.toDataURL('image/jpeg',.78),w,h})};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('format gambar tidak didukung browser'))};im.src=url})}
const fileBase=r=>`4M_Verification_${slug(r.project)}_${r.date||today()}`;

/* ---------- export Excel ---------- */
async function exportXlsx(){
  const r=curR();if(!r)return;
  if(!window.ExcelJS){toast('Library Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.');return}
  await ensureAll(r);
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('Master',{views:[{showGridLines:false}],pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
  ws.columns=[3,6,14,13,22,17,17,18,3].map(width=>({width}));
  const thin={style:'thin',color:{argb:'FF000000'}},B={top:thin,left:thin,bottom:thin,right:thin};
  const box=(a)=>{const [c1,r1,c2,r2]=a;for(let y=r1;y<=r2;y++)for(let x=c1;x<=c2;x++)ws.getCell(y,x).border=B};
  for(let i=1;i<=3;i++)ws.getRow(i).height=22;
  ws.mergeCells('A1:C3');ws.mergeCells('D1:I3');box([1,1,3,3]);box([4,1,9,3]);
  const t=ws.getCell('D1');t.value='4M CHANGE VERIFICATION CHECKSHEET';t.font={name:'Calibri',size:18,bold:true};t.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  const lg=wb.addImage({base64:LOGO,extension:'png'});ws.addImage(lg,{tl:{col:0.05,row:0.35},ext:{width:165,height:59}});
  const info=[['Project',r.project],['Verification Date',fmtDate(r.date)],['Verificator',r.verificator],['Area',r.area]];
  info.forEach(([k,v],i)=>{const y=5+i;ws.mergeCells(`B${y}:C${y}`);ws.mergeCells(`D${y}:H${y}`);ws.getCell(`B${y}`).value=k;ws.getCell(`D${y}`).value=': '+(v||'');ws.getCell(`B${y}`).font={name:'Calibri',size:11};ws.getCell(`D${y}`).font={name:'Calibri',size:11}});
  const H=10;ws.mergeCells(`F${H}:G${H}`);
  [['B','No'],['C','Process'],['D','Type'],['E','Eng Trial Result'],['F','Evidence'],['H','Verification Result']].forEach(([c,v])=>{const x=ws.getCell(`${c}${H}`);x.value=v;x.font={name:'Calibri',size:11,bold:true};x.alignment={horizontal:'center',vertical:'middle',wrapText:true};x.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7EAEE'}}});
  ws.getRow(H).height=30;box([2,H,8,H]);
  const AREA_W=236,PX=7;
  r.rows.forEach((w,i)=>{
    const y=H+1+i;ws.mergeCells(`F${y}:G${y}`);
    const ph=w.ev.map(id=>photos.get(id)).filter(p=>p&&p.data);
    const maxH=Math.max(50,Math.min(120,Math.floor(430/Math.max(ph.length,1))-4));
    const sizes=ph.map(p=>{const s=Math.min(AREA_W/p.w,maxH/p.h,1);return{w:Math.round(p.w*s),h:Math.round(p.h*s)}});
    const textPx=w.evText?30:0;
    const px=Math.max(52,sizes.reduce((a,s)=>a+s.h+4,4)+textPx);
    ws.getRow(y).height=Math.min(409,px*0.75);
    const cell=(c,v)=>{const x=ws.getCell(`${c}${y}`);x.value=v||'';x.font={name:'Calibri',size:11};x.alignment={horizontal:'center',vertical:'middle',wrapText:true};return x};
    cell('B',i+1);cell('C',w.process);cell('D',w.type);cell('E',w.trial);
    const ev=cell('F',w.evText);ev.alignment={horizontal:'center',vertical:'bottom',wrapText:true};
    const rs=cell('H',w.result);
    if(w.result==='OK')rs.font={name:'Calibri',size:11,bold:true,color:{argb:'FF1D7A4B'}};
    if(w.result==='NG'){rs.font={name:'Calibri',size:11,bold:true,color:{argb:'FFB3261E'}};rs.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFBD5D1'}}}
    if(w.result==='Deviasi'){rs.font={name:'Calibri',size:11,bold:true,color:{argb:'FF8A5A00'}};rs.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFDE7B0'}}}
    box([2,y,8,y]);
    let off=4;const rowPx=px;
    ph.forEach((p,k)=>{
      const id=wb.addImage({base64:p.data,extension:'jpeg'});
      const xo=Math.max(0,Math.round((AREA_W+12-sizes[k].w)/2));
      const colF=17*PX+5,E=9525;
      const nc=xo<colF?5:6,nco=xo<colF?xo:Math.min(xo-colF,colF-1);
      ws.addImage(id,{tl:{nativeCol:nc,nativeColOff:nco*E,nativeRow:y-1,nativeRowOff:off*E},ext:{width:sizes[k].w,height:sizes[k].h}});
      off+=sizes[k].h+4;
    });
  });
  const buf=await wb.xlsx.writeBuffer();
  download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fileBase(r)+'.xlsx');
  toast('File Excel dibuat.');
}

document.addEventListener('click',async e=>{

  const c=curC(),r=curR();
  switch(a){
    case 'tab':ui.tab=t.dataset.t;ui.q='';render();break;
    case 'newCheck':newCheck();break;
    case 'selCheck':ui.cid=t.dataset.id;renderList();$('#editPane').innerHTML=editCheckHTML();break;
    case 'delItem':{const id=t.closest('[data-item]').dataset.item;c.items=c.items.filter(i=>i.id!==id);touch(c);$('#editPane').innerHTML=editCheckHTML();renderList();break}
    case 'addItem':{const v=$('#newItem').value.trim();if(!v)break;c.items.push({id:uid(),name:v,done:false,note:'',at:null});touch(c);$('#editPane').innerHTML=editCheckHTML();renderList();$('#newItem').focus();break}
    case 'resetChecks':c.items.forEach(i=>{i.done=false;i.at=null});touch(c);$('#editPane').innerHTML=editCheckHTML();renderList();break;
    case 'dupCheck':{const n=structuredClone(c);n.id=uid();n.created=n.updated=Date.now();n.date=today();n.items.forEach(i=>{i.id=uid();i.done=false;i.at=null;i.note=''});db.checklists.push(n);ui.cid=n.id;touch(n);viewCheck();toast('Checklist diduplikat.');break}
    case 'delCheck':if(await ask('Hapus checklist?',`Checklist "${c.project||'tanpa project'}" akan dihapus permanen.`)){db.checklists=db.checklists.filter(x=>x.id!==c.id);ui.cid=null;await sbDel('cc_checklists',c.id);viewCheck()}break;
    case 'newReport':newReport();break;
    case 'selReport':ui.rid=t.dataset.id;renderList();$('#editPane').innerHTML=editRepHTML();ensurePhotos(curR());break;
    case 'addRow':{const w=newRow('');r.rows.push(w);touch(r);$('#editPane').innerHTML=editRepHTML();renderList();document.querySelector(`[data-row="${w.id}"] [data-rf=process]`).focus();break}
    case 'rowUp':case 'rowDown':{const id=t.closest('[data-row]').dataset.row;const i=r.rows.findIndex(w=>w.id===id),j=a==='rowUp'?i-1:i+1;if(j<0||j>=r.rows.length)break;[r.rows[i],r.rows[j]]=[r.rows[j],r.rows[i]];touch(r);$('#editPane').innerHTML=editRepHTML();break}
    case 'rowDel':{const id=t.closest('[data-row]').dataset.row;const w=r.rows.find(x=>x.id===id);if((w.ev.length||w.result||w.evText)&&!await ask('Hapus baris?',`Baris "${w.process}" berisi data/foto dan akan dihapus.`))break;w.ev.forEach(id=>delPhoto(r,id));touch(r);r.rows=r.rows.filter(x=>x.id!==id);touch(r);$('#editPane').innerHTML=editRepHTML();renderList();break}
    case 'openPhoto':{const id=t.dataset.p;ui.lb={row:t.closest('[data-row]').dataset.row,id};$('#lb img').src=photos.get(id).data;$('#lb').hidden=false;break}
    case 'lbClose':$('#lb').hidden=true;ui.lb=null;break;
    case 'lbDel':{const rp=curR();const w=rp.rows.find(x=>x.id===ui.lb.row);w.ev=w.ev.filter(x=>x!==ui.lb.id);delPhoto(rp,ui.lb.id);touch(rp);$('#lb').hidden=true;ui.lb=null;document.querySelector(`[data-row="${w.id}"] .thumbs`).innerHTML=thumbsHTML(w);break}
    case 'exportPdf':exportPdf();break;
    case 'exportXlsx':exportXlsx().catch(err=>toast('Gagal membuat Excel: '+err.message));break;
    case 'dupReport':{const n=structuredClone(r);n.id=uid();n.created=n.updated=Date.now();n.date=today();n.rows=n.rows.map(w=>({...newRow(w.process),type:w.type}));n.pm={};db.reports.push(n);ui.rid=n.id;touch(n);viewReport();toast('Report diduplikat tanpa hasil dan foto.');break}
    case 'delReport':if(await ask('Hapus report?',`Report "${r.project||'tanpa project'}" beserta fotonya akan dihapus permanen.`)){const paths=Object.values(r.pm||{}).map(m=>m.path);if(paths.length)sb.storage.from(BUCKET).remove(paths).catch(()=>{});r.rows.forEach(w=>w.ev.forEach(id=>photos.delete(id)));db.reports=db.reports.filter(x=>x.id!==r.id);ui.rid=null;await sbDel('cc_reports',r.id);viewReport()}break;
    /* pengaturan */
    case 'leAdd':case 'leUp':case 'leDown':case 'leDel':{
      const box=t.closest('[data-le]');const arr=getArr(box.dataset.le);if(!arr)break;const i=+t.dataset.i;
      if(a==='leAdd'){const inp=box.querySelector('[data-leadd]');const v=inp.value.trim();if(!v)break;arr.push(v)}
      if(a==='leDel')arr.splice(i,1);
      if(a==='leUp'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
      if(a==='leDown'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
      scheduleSave();viewSettings();if(a==='leAdd')document.querySelector(`[data-le="${box.dataset.le}"] [data-leadd]`).focus();break}
    case 'mAdd':db.settings.masters.push({id:uid(),name:'Master baru',items:['Item 1']});scheduleSave();viewSettings();break;
    case 'mDel':{const id=t.closest('[data-master]').dataset.master;if(await ask('Hapus master?','Checklist yang sudah dibuat dari master ini tidak terpengaruh.')){db.settings.masters=db.settings.masters.filter(m=>m.id!==id);scheduleSave();viewSettings()}break}
    case 'mReset':{const m=db.settings.masters.find(x=>x.id===t.closest('[data-master]').dataset.master);if(await ask('Kembalikan default?','Daftar item master ini diganti dengan daftar awal.','Kembalikan')){m.items=[...(m.name==='Line 2'?DEF_L2:DEF_L1)];scheduleSave();viewSettings()}break}
    case 'pReset':if(await ask('Kembalikan default?','Template proses report diganti dengan 17 baris awal.','Kembalikan')){db.settings.proc=[...DEF_PROC];scheduleSave();viewSettings()}break;
    case 'logout':await saveNow();await sb.auth.signOut();showAuth();break;
    case 'signup':{const em=$('#a_mail').value.trim(),pw=$('#a_pass').value;if(!em||pw.length<6){authMsg('Isi email dan password (minimal 6 karakter).');break}authMsg('Membuat akun…');const {data,error}=await sb.auth.signUp({email:em,password:pw});if(error){authMsg(trErr(error.message));break}if(data.session)boot(data.session);else authMsg('Akun dibuat. Cek email untuk konfirmasi, lalu klik Masuk.');break}
    case 'bkExport':{toast('Menyiapkan backup…');await Promise.all([...photos.keys()].map(loadPhoto));const out={app:'4m-change-control',v:2,db,photos:[...photos.values()].filter(p=>p.data).map(p=>({id:p.id,data:p.data,w:p.w,h:p.h}))};download(new Blob([JSON.stringify(out)],{type:'application/json'}),`4M_backup_${today()}.json`);toast('Backup di-download.');break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('#lb').hidden=true;$('#modalBg').hidden=true}
  if(e.key==='Enter'&&e.target.matches('[data-leadd]')){e.preventDefault();e.target.nextElementSibling.click()}
  if(e.key==='Enter'&&e.target.id==='newItem'){e.preventDefault();e.target.nextElementSibling.click()}
});
function onField(e){
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;renderList();return}
  if(t.dataset.bind){const [sc,f]=t.dataset.bind.split(':');
    if(sc==='def'){db.settings.defaults[f]=t.value;scheduleSave();return}
    const rec=sc==='check'?curC():curR();if(!rec)return;rec[f]=t.value;touch(rec);if(e.type==='change')renderList();return}
  if(t.dataset.ik){const c=curC();const it=c.items.find(i=>i.id===t.closest('[data-item]').dataset.item);it[t.dataset.ik]=t.value;touch(c);return}
  if(t.dataset.rf){const r=curR();const w=r.rows.find(x=>x.id===t.closest('[data-row]').dataset.row);w[t.dataset.rf]=t.value;
    if(t.tagName==='SELECT')t.dataset.v=t.value;touch(r);
    if(t.dataset.rf==='result'){$('#sum').innerHTML=sumHTML(r);if(e.type==='change')renderList()}return}
  if(t.dataset.lei!==undefined){const arr=getArr(t.closest('[data-le]').dataset.le);arr[+t.dataset.lei]=t.value;scheduleSave();return}
  if(t.dataset.mname!==undefined){const m=db.settings.masters.find(x=>x.id===t.closest('[data-master]').dataset.master);m.name=t.value;scheduleSave()}
}
document.addEventListener('input',onField);
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='toggle'){const c=curC();const it=c.items.find(i=>i.id===t.closest('[data-item]').dataset.item);it.done=t.checked;it.at=t.checked?Date.now():null;touch(c);const li=t.closest('.ci');li.outerHTML=itemHTML(it);updateCheckBar();renderList();return}
  if(t.matches('[data-ph]')){
    const r=curR();const w=r.rows.find(x=>x.id===t.closest('[data-row]').dataset.row);const files=[...t.files];t.value='';
    let bad=0;
    for(const f of files){try{const p=await compress(f);p.id=uid();await addPhoto(r,p);w.ev.push(p.id)}catch(err){bad++}}
    touch(r);document.querySelector(`[data-row="${w.id}"] .thumbs`).innerHTML=thumbsHTML(w);
    if(bad)toast(`${bad} foto gagal diproses atau diunggah (format HEIC tidak didukung, atau koneksi bermasalah).`);
    return}
  if(t.id==='bkFile'){
    const f=t.files[0];t.value='';if(!f)return;
    try{const j=JSON.parse(await f.text());if(j.app!=='4m-change-control'||!j.db)throw new Error('bukan file backup aplikasi ini');
      const cl=j.db.checklists||[],rp=j.db.reports||[],pl=j.photos||[];
      if(!await ask('Impor backup?',`Menambahkan ${cl.length} checklist, ${rp.length} report, dan ${pl.length} foto ke akun ini. Data dengan ID sama akan ditimpa.`,'Impor'))return;
      toast('Mengimpor…');const pm=new Map(pl.map(p=>[p.id,p]));
      for(const c of cl){c.updated=c.updated||Date.now();db.checklists=db.checklists.filter(x=>x.id!==c.id);db.checklists.push(c);touch(c)}
      for(const r of rp){r.pm={};for(const w of r.rows){const keep=[];for(const id of w.ev||[]){const p=pm.get(id);if(p&&p.data){await addPhoto(r,{id,data:p.data,w:p.w,h:p.h});keep.push(id)}}w.ev=keep}
        db.reports=db.reports.filter(x=>x.id!==r.id);db.reports.push(r);touch(r)}
      await saveNow();toast('Backup diimpor.');viewBackup()
    }catch(err){toast('Gagal mengimpor: '+err.message)}return}
  onField(e);
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='af')return;e.preventDefault();
  authMsg('Masuk…');const {data,error}=await sb.auth.signInWithPassword({email:$('#a_mail').value.trim(),password:$('#a_pass').value});
  if(error){authMsg(trErr(error.message));return}boot(data.session);
});
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')$('#modalBg').hidden=true});
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').hidden=true});

/* ---------- start ---------- */
(async function(){
  if(!window.supabase){$('#app').innerHTML='<div class="pane editor empty"><h2>Tidak bisa terhubung</h2><div>Library Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</div></div>';setState(1,'offline');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&db)showAuth('Sesi berakhir. Silakan masuk lagi.')});
  const {data}=await sb.auth.getSession();
  if(data.session)boot(data.session);else showAuth();
})();
</script>
</body>
